name: Fork IPA Build

# 自用 fork 的 IPA 构建流程。
#
# 参照上游 .github/workflows/alpha.yml，但去掉了所有需要 secrets 的发布步骤：
#   - 跨仓库推送 SideStore/apps-v2.json（需要 secrets.CROSS_REPO_PUSH_KEY，fork 不继承该 secret）
#   - 生成 source-metadata.json 并上传到 GitHub Release
#   - deploy 到 sidestore.io 源
# 本流程只保留「构建 + fake-sign + 打包 IPA」，以 Actions artifact 形式提供下载。
#
# 触发方式：Actions 页 → Fork IPA Build → Run workflow（默认手动，避免每次 push 都烧 macOS 额度）
# 如需 push 自动触发，取消下面 on.push 段的注释即可。

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  # push:
  #   branches: [develop]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - 'scripts/i18n/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-fork-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.2'

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # 复用上游自己的构建脚本：make -B build && make fakesign && make ipa
      # 产物为仓库根目录的 SideStore.ipa 与 SideStore.dSYMs.zip
      - name: Build, fake-sign and package IPA
        env:
          BUILD_CONFIG: ${{ inputs.build_config || 'Release' }}
        run: python3 scripts/ci/workflow.py build

      - name: Verify IPA was produced
        run: |
          if [ ! -f SideStore.ipa ]; then
            echo "::error::SideStore.ipa was not produced"
            exit 1
          fi
          ls -lh SideStore.ipa SideStore.dSYMs.zip
          unzip -l SideStore.ipa | tail -3

          # 报告 .app 内界面文件与 .lproj 的实际布局。
          # 工程使用 folder-synchronized groups，子目录结构可能被保留到 bundle，
          # 这决定 zh-Hans.lproj 下各 <Name>.strings 该放哪一层。
          echo "=== storyboardc / xib 在 bundle 中的位置 ==="
          find SideStore.xcarchive/Products/Applications/SideStore.app \
            \( -name "*.storyboardc" -o -name "*.nib" \) | sort
          echo "=== .lproj 目录内容 ==="
          for d in SideStore.xcarchive/Products/Applications/SideStore.app/*.lproj; do
            echo "--- $d ---"
            ls -1 "$d"
          done

      - name: Compute version label
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          IPA_VERSION=$(python3 scripts/ci/workflow.py compute-normalized \
              "$MARKETING_VERSION" "${{ github.run_number }}" "$SHORT_COMMIT")
          echo "IPA_VERSION=$IPA_VERSION" >> "$GITHUB_ENV"
          echo "Artifact version label: $IPA_VERSION"

      # 与上游 alpha.yml 一致：IPA 与 dSYMs 分成两个独立 artifact。
      # 二者不是两个 app 版本，而是两类构建产物：
      #   SideStore-<version>.ipa        可安装的 App（巨魔/TrollStore 直接装这个）
      #   SideStore-<version>-dSYMs.zip 调试符号表，仅用于把崩溃日志的地址符号化，
      #                                 日常使用完全不需要，单独存放可避免每次白下 40MB。
      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: SideStore-${{ env.IPA_VERSION }}.ipa
          path: SideStore.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload dSYMs
        uses: actions/upload-artifact@v5
        with:
          name: SideStore-${{ env.IPA_VERSION }}-dSYMs.zip
          path: SideStore.dSYMs.zip
          retention-days: 14
          if-no-files-found: error
